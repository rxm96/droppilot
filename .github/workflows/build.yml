name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  models: read

jobs:
  # PR gate: same verification steps as the build job, but without the
  # expensive packaging/artifact work. Pushes to main and tags skip this
  # job and run the full build below instead.
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build renderer/main
        run: npm run build

  build:
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build renderer/main
        run: npm run build

      - name: Package (Windows)
        if: runner.os == 'Windows'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win --publish never

      - name: Package (macOS)
        if: runner.os == 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: droppilot-${{ runner.os }}
          path: |
            release/*.exe
            release/*.blockmap
            release/*.dmg
            release/*.zip
            release/*.yml

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate technical release notes
        id: generated_notes
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = context.ref.replace("refs/tags/", "");
            const isPrereleaseTag = /-(test|rc|beta|alpha)(?:[.-]\d+)?$/i.test(tag);

            let previousTagName;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });
            const stable = releases.find(
              (release) => !release.draft && !release.prerelease && release.tag_name !== tag,
            );
            if (stable?.tag_name) {
              previousTagName = stable.tag_name;
            }

            const params = {
              owner,
              repo,
              tag_name: tag,
              target_commitish: context.sha,
              ...(previousTagName ? { previous_tag_name: previousTagName } : {}),
            };
            const { data } = await github.rest.repos.generateReleaseNotes(params);
            const body = (data.body ?? "").trim();
            const onlyFullChangelog =
              /^full\s+changelog\b[:\s-]*/i.test(body.replace(/^#+\s*/g, ""));
            core.setOutput("notes", onlyFullChangelog ? "" : body);
            core.setOutput("base_tag", previousTagName ?? "");
            core.setOutput("tag", tag);
            core.setOutput("is_prerelease", String(isPrereleaseTag));

      - name: Collect evidence and gate
        id: collect
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ steps.generated_notes.outputs.tag }}
          BASE_TAG: ${{ steps.generated_notes.outputs.base_tag }}
          TECH_NOTES: ${{ steps.generated_notes.outputs.notes }}
        run: node scripts/release-notes/run.mjs collect

      - name: Generate user notes
        id: gen
        if: steps.collect.outputs.has_candidates == 'true'
        continue-on-error: true
        uses: actions/ai-inference@v1
        with:
          model: openai/gpt-4o
          prompt-file: rn-work/gen-prompt.txt
          max-completion-tokens: "800"
          temperature: "0.2"

      - name: Parse generation output
        id: parse_gen
        if: steps.collect.outputs.has_candidates == 'true'
        env:
          RESPONSE_FILE: ${{ steps.gen.outputs.response-file }}
          ATTEMPT: "1"
        run: node scripts/release-notes/run.mjs parse-gen

      - name: Generate user notes (strict retry)
        id: gen_retry
        if: steps.collect.outputs.has_candidates == 'true' && steps.parse_gen.outputs.parse_ok == 'false'
        continue-on-error: true
        uses: actions/ai-inference@v1
        with:
          model: openai/gpt-4o
          prompt-file: rn-work/gen-prompt-strict.txt
          max-completion-tokens: "800"
          temperature: "0"

      - name: Parse retry output
        id: parse_gen_retry
        if: steps.collect.outputs.has_candidates == 'true' && steps.parse_gen.outputs.parse_ok == 'false'
        env:
          RESPONSE_FILE: ${{ steps.gen_retry.outputs.response-file }}
          ATTEMPT: "2"
        run: node scripts/release-notes/run.mjs parse-gen

      - name: Judge bullets
        id: judge
        if: steps.parse_gen.outputs.has_bullets == 'true' || steps.parse_gen_retry.outputs.has_bullets == 'true'
        continue-on-error: true
        uses: actions/ai-inference@v1
        with:
          model: openai/gpt-4o
          prompt-file: rn-work/judge-prompt.txt
          max-completion-tokens: "600"
          temperature: "0"

      - name: Finalize release body
        env:
          TECH_NOTES: ${{ steps.generated_notes.outputs.notes }}
          JUDGE_RESPONSE_FILE: ${{ steps.judge.outputs.response-file }}
        run: node scripts/release-notes/run.mjs finalize

      - name: Upload notes-pipeline debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-notes-debug
          path: rn-work/
          if-no-files-found: ignore

      - name: Resolve release visibility
        id: release_visibility
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == *"-test"* ]]; then
            echo "draft=true" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == *"-rc"* || "$TAG" == *"-beta"* || "$TAG" == *"-alpha"* ]]; then
            echo "draft=false" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "draft=false" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: rn-work/release_body.md
          draft: ${{ steps.release_visibility.outputs.draft }}
          prerelease: ${{ steps.release_visibility.outputs.prerelease }}
          files: |
            artifacts/*.exe
            artifacts/*.blockmap
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.yml
